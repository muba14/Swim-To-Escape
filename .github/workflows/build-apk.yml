# Builds an installable APK on every push. Download it from the run's
# "Artifacts" section (Actions tab -> latest run -> swim-to-escape-apk).
name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.muba14 --project-name swim_to_escape .
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos lib
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: swim-to-escape-apk
          path: build/app/outputs/flutter-apk/app-release.apk
